<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
<title id="title">RRT and RMPflow apple harvesting flow</title>
<desc id="desc">RGB-D detection flows through target validation, collision-aware Lula RRT planning, trajectory validation, RMPflow execution, contact-based grasp and twist-and-pull harvesting, and conveyor placement. PhysX contact monitoring supervises execution.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#52627a"/></marker>
  <style>
    .bg{fill:#f5f7fb}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:18}
    .plan{fill:#eaf2ff;stroke:#4f7fd1}.exec{fill:#e9f7f1;stroke:#3d9b72}
    .guard{fill:#fff4df;stroke:#d79a2b}.title{font:700 20px 'Segoe UI',sans-serif;fill:#17243a}
    .sub{font:15px 'Segoe UI',sans-serif;fill:#43516a}.edge{fill:none;stroke:#52627a;stroke-width:3;marker-end:url(#arrow)}
    .dash{fill:none;stroke:#bd7c16;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrow)}
    .label{font:700 15px 'Segoe UI',sans-serif;fill:#25344e}
  </style>
</defs>
<rect class="bg" width="1100" height="720" rx="24"/>
<text x="550" y="42" text-anchor="middle" class="title" style="font-size:25px">충돌 회피 기반 사과 수확 · RRT + RMPflow</text>
<g transform="translate(0,15)">
<rect class="box" x="390" y="55" width="320" height="76"/>
<text class="title" x="550" y="85" text-anchor="middle">RGB-D 사과 검출</text><text class="sub" x="550" y="111" text-anchor="middle">depth · TF → world target</text>
<rect class="box" x="390" y="166" width="320" height="76"/>
<text class="title" x="550" y="196" text-anchor="middle">목표 검증 · 대기열</text><text class="sub" x="550" y="222" text-anchor="middle">target ID · reset 세대 · 상태 확인</text>
<rect class="plan" x="390" y="277" width="320" height="84"/>
<text class="title" x="550" y="309" text-anchor="middle">Lula RRT 경로 계획</text><text class="sub" x="550" y="337" text-anchor="middle">IK 후보 · 전체 링크 충돌 · 우회 경로</text>
<rect class="plan" x="390" y="396" width="320" height="84"/>
<text class="title" x="550" y="428" text-anchor="middle">궤적 생성 · 재검증</text><text class="sub" x="550" y="456" text-anchor="middle">시간 매개화 · 관절 제한 · 충돌 검사</text>
<rect class="exec" x="390" y="515" width="320" height="84"/>
<text class="title" x="550" y="547" text-anchor="middle">RMPflow 실행</text><text class="sub" x="550" y="575" text-anchor="middle">나무 밖 → staging → pre-grasp</text>
<path class="edge" d="M550 131v30"/><path class="edge" d="M550 242v30"/><path class="edge" d="M550 361v30"/><path class="edge" d="M550 480v30"/>
<rect class="exec" x="70" y="515" width="250" height="84"/>
<text class="title" x="195" y="547" text-anchor="middle">접촉 기반 수확</text><text class="sub" x="195" y="575" text-anchor="middle">그리퍼 포위 · 비틀기 · 당김</text>
<rect class="exec" x="780" y="515" width="250" height="84"/>
<text class="title" x="905" y="547" text-anchor="middle">배치 · 다음 목표</text><text class="sub" x="905" y="575" text-anchor="middle">줄기 분리 확인 · 컨베이어</text>
<path class="edge" d="M390 557H325"/><path class="edge" d="M320 585C360 635 740 635 780 585"/>
<rect class="guard" x="390" y="635" width="320" height="62"/>
<text class="title" x="550" y="661" text-anchor="middle">PhysX 접촉 · 실행 감시</text><text class="sub" x="550" y="684" text-anchor="middle">취소 · 정체 · 안전 정지</text>
<path class="dash" d="M440 635C390 620 370 590 390 565"/><path class="dash" d="M660 635C710 620 730 590 710 565"/>
<text class="label" x="550" y="620" text-anchor="middle">실행 중 상시 감독</text>
</g></svg>